<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="280" rx="16" fill="#F8FAFC"/>
