      <text x="16" y="58" font-weight="700" fill="#0F172A">Acme Motors Pvt Ltd</text>
      <text x="16" y="80" fill="#475569">12, MG Road, Pune 411001</text>
    </g>
    <g transform="translate(260,64)">
      <rect width="200" height="118" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="16" y="28" font-size="12" font-weight="700" fill="#64748B">META PORTFOLIO</text>
      <text x="16" y="58" font-weight="700" fill="#0F172A">Acme Motors Pvt Ltd</text>
      <text x="16" y="80" fill="#475569">12, MG Road, Pune 411001</text>
    </g>
    <g transform="translate(484,64)">
      <rect width="200" height="118" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="16" y="28" font-size="12" font-weight="700" fill="#64748B">WEBSITE FOOTER</text>
      <text x="16" y="58" font-weight="700" fill="#0F172A">Acme Motors Pvt Ltd</text>
      <text x="16" y="80" fill="#475569">acmemotors.in</text>
