<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="960" height="300" rx="16" fill="#F8FAFC"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- connectors -->
  <line x1="222" y1="130" x2="252" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="462" y1="130" x2="492" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="702" y1="130" x2="732" y2="130" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1 number -->
  <g transform="translate(24,40)">
    <rect width="196" height="180" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="28" cy="30" r="14" fill="#25D366"/>
    <text x="28" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <rect x="76" y="54" width="44" height="64" rx="8" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="88" y="66" width="20" height="16" rx="2" fill="#25D366"/>
    <line x1="92" y1="70" x2="92" y2="78" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="98" y1="70" x2="98" y2="78" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="104" y1="70" x2="104" y2="78" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="98" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Business number</text>
    <text x="98" y="166" text-anchor="middle" font-size="12" fill="#475569">Company SIM or landline</text>
  </g>

  <!-- 2 portfolio -->
  <g transform="translate(264,40)">
    <rect width="196" height="180" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="28" cy="30" r="14" fill="#25D366"/>
    <text x="28" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <rect x="70" y="64" width="56" height="52" rx="4" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <path d="M70,64 L98,48 L126,64" fill="none" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="80" y="76" width="10" height="10" fill="#1877F2"/>
    <rect x="106" y="76" width="10" height="10" fill="#1877F2"/>
    <rect x="92" y="96" width="12" height="20" fill="#1877F2"/>
    <text x="98" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Business portfolio</text>
    <text x="98" y="166" text-anchor="middle" font-size="12" fill="#475569">business.facebook.com</text>
  </g>

  <!-- 3 verification -->
  <g transform="translate(504,40)">
    <rect width="196" height="180" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="28" cy="30" r="14" fill="#25D366"/>
    <text x="28" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <rect x="72" y="50" width="46" height="62" rx="4" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="80" y1="64" x2="110" y2="64" stroke="#94A3B8" stroke-width="2"/>
    <line x1="80" y1="74" x2="110" y2="74" stroke="#94A3B8" stroke-width="2"/>
    <line x1="80" y1="84" x2="100" y2="84" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="118" cy="106" r="15" fill="#25D366"/>
    <path d="M111,106 L116,111 L125,101" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Verify business</text>
    <text x="98" y="166" text-anchor="middle" font-size="12" fill="#475569">GST, CoI or Udyam</text>
  </g>

  <!-- 4 connect -->
  <g transform="translate(744,40)">
    <rect width="192" height="180" rx="12" fill="#ECFDF5" stroke="#25D366" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="14" fill="#25D366"/>
    <text x="28" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
    <rect x="62" y="50" width="68" height="50" rx="12" fill="#25D366"/>
    <path d="M78,98 L74,114 L92,99 z" fill="#25D366"/>
    <path d="M82,75 L92,85 L111,65" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Connect to Uservox</text>
    <text x="96" y="166" text-anchor="middle" font-size="12" fill="#475569">WABA is created here</text>
  </g>

  <text x="480" y="262" text-anchor="middle" font-size="13" fill="#64748B">Steps 1–3 happen outside Uservox. Step 3 can also be finished after you connect.</text>
</svg>
